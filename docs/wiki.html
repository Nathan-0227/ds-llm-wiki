<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料結構 LLM Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm reference manual for a course
   IDEA: a metro map — pages are stations, [[links]] are lines between them
   PICTURE: line-coloured station list in the sidebar, coloured chips for citations
   COLOUR and TYPE: white / night #0e1116, ink black, red #e6261f, blue #0a5cff, amber #ffb400, green #00a05a; Figtree 800 + Noto Sans TC
   LAYOUT: sticky station list left, reading column right; stacks under 760px */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e1116);--ink:light-dark(#111,#e9edf2);--mute:light-dark(#5b6470,#9aa5b1);--line:light-dark(#e3e6ea,#262c35);--panel:light-dark(#f6f7f9,#151a21);--red:#e6261f;--blue:#0a5cff;--amber:#ffb400;--green:#00a05a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC","Figtree",system-ui,sans-serif;overflow-x:clip}
header{display:flex;gap:16px;align-items:center;padding:14px max(4vw,16px);border-bottom:4px solid var(--ink);flex-wrap:wrap}
header h1{font:800 22px/1.1 Figtree,"Noto Sans TC",sans-serif;margin:0}
header p{margin:0;color:var(--mute);font-size:14px}
#q{margin-left:auto;font:16px inherit;padding:8px 12px;border:2px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);width:min(260px,100%)}
#q:focus-visible{outline:3px solid var(--blue)}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:18px 16px 40px;border-right:1px solid var(--line)}
nav h2{font:800 13px/1 Figtree,sans-serif;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
nav h2::before{content:"";width:22px;height:6px;border-radius:3px;background:var(--c)}
nav a{display:flex;gap:10px;align-items:flex-start;padding:5px 6px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
nav a::before{content:"";flex:none;width:11px;height:11px;margin-top:3px;border-radius:50%;border:3px solid var(--c);background:var(--bg)}
nav a.on{background:var(--panel);font-weight:700}
nav a:hover{background:var(--panel)}
main{padding:24px max(4vw,16px) 80px}
article{max-width:760px}
article h1{font:800 clamp(28px,4vw,40px)/1.1 Figtree,"Noto Sans TC",sans-serif;margin:.2em 0 .6em;text-wrap:balance}
article h2{font:800 22px/1.2 Figtree,"Noto Sans TC",sans-serif;margin:1.6em 0 .4em}
.path{font-size:13px;color:var(--mute)}
a.cite{display:inline-block;font:600 12px/1 Figtree,sans-serif;padding:3px 7px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap;vertical-align:1px}
a.wl{color:var(--red);font-weight:700;text-decoration:none;border-bottom:2px solid currentColor}
blockquote{margin:1em 0;padding:10px 14px;border-left:6px solid var(--amber);background:var(--panel);border-radius:0 8px 8px 0}
blockquote p{margin:0}
pre{background:var(--panel);padding:14px;border-radius:8px;overflow-x:auto;font-size:14px;line-height:1.5}
code{overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-family:Figtree,"Noto Sans TC",sans-serif;border-bottom:2px solid var(--ink)}
.empty{color:var(--mute)}
@media(max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);columns:2;column-gap:12px}nav h2{break-after:avoid}table{font-size:13px}}
</style></head><body>

<script>
{
const PAGES=[{"id": "index", "title": "Index", "group": "首頁", "path": "wiki/index.md", "html": "<h1>CSE 215 資料結構 LLM Wiki · Index</h1>\n<p>規則見 AGENTS.md；需求見 00-需求訪談紀錄.md。</p>\n<h2>概念頁（深度層）</h2>\n<ul>\n<li><a class=\"wl\" href=\"#graph-basics\">graph-basics</a>：圖的定義、degree、有向／無向</li>\n<li><a class=\"wl\" href=\"#graph-representation\">graph-representation</a>：adjacency matrix vs adjacency list</li>\n<li><a class=\"wl\" href=\"#dfs\">dfs</a>：深度優先搜尋（遞迴版、性質、執行時間）</li>\n<li><a class=\"wl\" href=\"#bfs\">bfs</a>：廣度優先搜尋（分層版、性質、執行時間）</li>\n<li><a class=\"wl\" href=\"#dfs-applications\">dfs-applications</a>：connected components、topological sorting</li>\n<li><a class=\"wl\" href=\"#bfs-applications\">bfs-applications</a>：shortest path、bipartite</li>\n<li><a class=\"wl\" href=\"#dfs-nonrecursive\">dfs-nonrecursive</a>：用 stack 的非遞迴 DFS（G2 範例）</li>\n<li><a class=\"wl\" href=\"#bfs-queue\">bfs-queue</a>：用 queue 的 BFS（G2 範例）</li>\n<li><a class=\"wl\" href=\"#example-graph-g\">example-graph-g</a>：G2 的範例圖與走訪順序（腳本核對）</li>\n<li><a class=\"wl\" href=\"#stack-and-queue\">stack-and-queue</a>：LIFO／FIFO、與 DFS／BFS 的關係</li>\n<li><a class=\"wl\" href=\"#tree-traversal\">tree-traversal</a>：pre／in／post／level-order、BST</li>\n<li><a class=\"wl\" href=\"#big-o\">big-o</a>：時間複雜度</li>\n</ul>\n<h2>來源頁</h2>\n<ul>\n<li><a class=\"wl\" href=\"#G1\">G1</a> Lecture 9 Graphs, BFS and DFS（深度）</li>\n<li><a class=\"wl\" href=\"#G2\">G2</a> Nonrecursive DFS and BFS（深度）</li>\n<li><a class=\"wl\" href=\"#C3\">C3</a> Ch3 Stacks and Queues（深度）</li>\n<li><a class=\"wl\" href=\"#C4\">C4</a> Ch4 Linked Lists（深度）</li>\n<li><a class=\"wl\" href=\"#C5\">C5</a> Ch5 Trees（深度）</li>\n<li><a class=\"wl\" href=\"#C1\">C1</a> Ch1 Basic Concepts（深度）</li>\n</ul>\n<h2>來源頁（輕量層：只有來源頁，之後可升級為深度）</h2>\n<ul>\n<li><a class=\"wl\" href=\"#C2\">C2</a> Ch2 Arrays</li>\n<li><a class=\"wl\" href=\"#C7\">C7</a> Ch7 Sorting</li>\n<li><a class=\"wl\" href=\"#C7E\">C7E</a> Ch7 External Merge Sort</li>\n<li><a class=\"wl\" href=\"#C8\">C8</a> Ch8 Hashing</li>\n<li><a class=\"wl\" href=\"#C10\">C10</a> Ch10 Efficient Binary Search Trees</li>\n<li><a class=\"wl\" href=\"#C11\">C11</a> Ch11 Multiway Search Trees</li>\n</ul>\n<h2>統計</h2>\n<ul>\n<li>講義：12 份（17 份上傳，5 份為重複檔已排除）；深度 6 份、輕量 6 份</li>\n</ul>"}, {"id": "bfs-applications", "title": "BFS 的應用", "group": "概念頁", "path": "wiki/concepts/bfs-applications.md", "html": "<h1>BFS 的應用</h1>\n<h2>Shortest path（最短路徑）</h2>\n<ul>\n<li>兩個 vertices 間的 distance，是它們之間最短路徑的邊數 <a class=\"cite\" href=\"#G1\">G1 p.94</a>。</li>\n<li>從 w 做 BFS，在 Li 裡的每個 v，w 到 v 的最短路徑長度就是 i <a class=\"cite\" href=\"#G1\">G1 p.94</a>。</li>\n<li>BFS tree 上的路徑就是一條最短路徑；如果找不到 v，distance 是無限大 <a class=\"cite\" href=\"#G1\">G1 p.94</a>。</li>\n<li>講義的課前練習：Samuel L. Jackson 的 Bacon number（答案是 2）<a class=\"cite\" href=\"#G1\">G1 p.90</a>。</li>\n</ul>\n<blockquote>\n<p>⚠ 講義文字不一致：同一頁寫「可以在 O(n+m) 找到 u 到 v 的最短路徑」，下一行又出現「time O(m)」<a class=\"cite\" href=\"#G1\">G1 p.95</a>；而講義另一頁給的 BFS 執行時間是 O(n + m) <a class=\"cite\" href=\"#G1\">G1 p.88</a>。</p>\n</blockquote>\n<h2>Bipartite 判定</h2>\n<ul>\n<li>問題：一群魚放兩個魚缸，會打架的不能放同一缸，做得到嗎？<a class=\"cite\" href=\"#G1\">G1 p.97</a></li>\n<li>Bipartite graph：可以把 vertices 塗成兩色，使同色之間沒有邊 <a class=\"cite\" href=\"#G1\">G1 p.98</a>。</li>\n<li>做法：把 BFS tree 的各層交替塗兩種顏色；若從未把相連的兩個 nodes 塗成同色，就是 bipartite，否則不是 <a class=\"cite\" href=\"#G1\">G1 p.103</a>。</li>\n<li>理由：若 BFS 把兩個 neighbors 塗成同色，代表找到一個 odd length 的 cycle，而 odd cycle 不可能用兩色塗好 <a class=\"cite\" href=\"#G1\">G1 p.115-116</a>。</li>\n<li>時間 O(n + m) <a class=\"cite\" href=\"#G1\">G1 p.117</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#bfs\">bfs</a></p>"}, {"id": "bfs-queue", "title": "用 Queue 實作 BFS", "group": "概念頁", "path": "wiki/concepts/bfs-queue.md", "html": "<h1>用 Queue 實作 BFS</h1>\n<ul>\n<li>BFS 的策略和 level-order 相似：先拜訪自己，再拜訪所有鄰居，再拜訪鄰居的鄰居 <a class=\"cite\" href=\"#G2\">G2 p.5</a>。</li>\n<li>和 level-order 一樣，BFS 以 queue 為基礎 <a class=\"cite\" href=\"#G2\">G2 p.5</a>。</li>\n</ul>\n<p><a class=\"cite\" href=\"#G2\">G2 p.6</a></p>\n<pre><code>Algorithm bfs(v)\n    q.createQueue();\n    q.enqueue(v);\n    mark v as visited;\n    while (!q.isEmpty()) {\n        w = q.dequeue();\n        for (each unvisited node u adjacent to w) {\n            q.enqueue(u);\n            mark u as visited;\n        }\n    }\n</code></pre>\n<h2>範例：在圖 G 上從 v5 開始（<a class=\"wl\" href=\"#example-graph-g\">example-graph-g</a>）<a class=\"cite\" href=\"#G2\">G2 p.7</a></h2>\n<table>\n<thead>\n<tr>\n<th>Visit</th>\n<th>Queue（front → back）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>v5</td>\n<td>v5 → empty <a class=\"cite\" href=\"#G2\">G2 p.7</a></td>\n</tr>\n<tr>\n<td>v3</td>\n<td>v3 <a class=\"cite\" href=\"#G2\">G2 p.7</a></td>\n</tr>\n<tr>\n<td>v4</td>\n<td>v3, v4 → v4 <a class=\"cite\" href=\"#G2\">G2 p.7</a></td>\n</tr>\n<tr>\n<td>v2</td>\n<td>v4, v2 → v2 → empty <a class=\"cite\" href=\"#G2\">G2 p.7</a></td>\n</tr>\n<tr>\n<td>v1</td>\n<td>v1 → empty <a class=\"cite\" href=\"#G2\">G2 p.7</a></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>拜訪順序：v5, v3, v4, v2, v1 <a class=\"cite\" href=\"#G2\">G2 p.7</a>。</li>\n</ul>\n<blockquote>\n<p>⚠ 與 G1 的差異：G1 的 BFS 用分層串列 Li，第 i 層是走 i 步能到的 nodes <a class=\"cite\" href=\"#G1\">G1 p.86</a>；G2 用一個 queue <a class=\"cite\" href=\"#G2\">G2 p.6</a>。</p>\n</blockquote>\n<p>相關：<a class=\"wl\" href=\"#bfs\">bfs</a>、<a class=\"wl\" href=\"#stack-and-queue\">stack-and-queue</a>、<a class=\"wl\" href=\"#tree-traversal\">tree-traversal</a></p>"}, {"id": "bfs", "title": "廣度優先搜尋（Breadth-First Search, BFS）", "group": "概念頁", "path": "wiki/concepts/bfs.md", "html": "<h1>廣度優先搜尋（Breadth-First Search, BFS）</h1>\n<h2>直覺</h2>\n<ul>\n<li>講義用「如果我們會飛」、「鳥瞰世界（bird's-eye view）」說明 BFS <a class=\"cite\" href=\"#G1\">G1 p.79</a><a class=\"cite\" href=\"#G1\">G1 p.81</a>。</li>\n<li>依照「幾步能到」把 nodes 分層：zero steps、one step、two steps、three steps <a class=\"cite\" href=\"#G1\">G1 p.81</a>。</li>\n<li>講義用一連串投影片，依「幾步能到」（steps）逐步上色 <a class=\"cite\" href=\"#G1\">G1 p.81-85</a>。</li>\n<li>叫 breadth-first 是因為「先盡量往廣處走」（go as broadly as we can），過程中隱含地建出一棵 BFS tree <a class=\"cite\" href=\"#G1\">G1 p.89</a>。</li>\n</ul>\n<h2>G1 的分層虛擬碼</h2>\n<ul>\n<li>Li 是從起點 w 走 i 步能到的 nodes 集合 <a class=\"cite\" href=\"#G1\">G1 p.86</a>。</li>\n</ul>\n<p><a class=\"cite\" href=\"#G1\">G1 p.86</a></p>\n<pre><code>Set Li = [] for i = 1, ..., n\nL0 = [w], where w is the start node\nMark w as visited\nFor i = 0, ..., n-1:\n    For u in Li:\n        For each v which is a neighbor of u:\n            If v isn't yet visited:\n                mark v as visited, and put it in Li+1\n</code></pre>\n<h2>性質</h2>\n<ul>\n<li>BFS 也會找到從起點能到達的所有 nodes，也可以用來找 connected components <a class=\"cite\" href=\"#G1\">G1 p.87</a>。</li>\n<li>BFS 的執行時間和 DFS 同理，是 O(n + m) <a class=\"cite\" href=\"#G1\">G1 p.88</a>。</li>\n<li>BFS 在 directed graph 上也能用 <a class=\"cite\" href=\"#G1\">G1 p.88</a>。</li>\n</ul>\n<blockquote>\n<p>⚠ 兩種寫法：G1 用分層的 Li 串列 <a class=\"cite\" href=\"#G1\">G1 p.86</a>；G2 用 queue 實作，見 <a class=\"wl\" href=\"#bfs-queue\">bfs-queue</a> <a class=\"cite\" href=\"#G2\">G2 p.6</a>。</p>\n</blockquote>\n<p>相關：<a class=\"wl\" href=\"#bfs-applications\">bfs-applications</a>、<a class=\"wl\" href=\"#dfs\">dfs</a>、<a class=\"wl\" href=\"#stack-and-queue\">stack-and-queue</a></p>"}, {"id": "big-o", "title": "時間複雜度與 Big-O", "group": "概念頁", "path": "wiki/concepts/big-o.md", "html": "<h1>時間複雜度與 Big-O</h1>\n<ul>\n<li>定義：如果存在正整數 a、b，使得所有 n ≧ b 時 f(n) ≦ a·g(n)，則 f(n) 是 O(g(n)) <a class=\"cite\" href=\"#C1\">C1 p.28</a>。</li>\n<li>例：4n² + 100n = O(n²)，因為 n ≧ 100 時 4n² + 100n ≦ 5n²（講義上標在文字抽取中會變成 4n2）<a class=\"cite\" href=\"#C1\">C1 p.28</a>。</li>\n<li>常數是 O(1)；不同底數的 log 只差常數倍，所以都寫 O(log n) <a class=\"cite\" href=\"#C1\">C1 p.28</a>。</li>\n<li>Time complexity 是程式需要的計算時間；Space complexity 是需要的記憶體 <a class=\"cite\" href=\"#C1\">C1 p.30</a>。</li>\n<li>函數成長比較：n = 32 時，n² = 1,024，2ⁿ = 4,294,967,296 <a class=\"cite\" href=\"#C1\">C1 p.29</a>。</li>\n</ul>\n<h2>在圖演算法裡（n 個 vertices、m 條 edges）</h2>\n<ul>\n<li>DFS、BFS 都是 O(n + m) <a class=\"cite\" href=\"#G1\">G1 p.56</a><a class=\"cite\" href=\"#G1\">G1 p.88</a>。</li>\n<li>兩種表示法的 Space requirements：O(n²) 與 O(n + m)，見 <a class=\"wl\" href=\"#graph-representation\">graph-representation</a> <a class=\"cite\" href=\"#G1\">G1 p.23</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#graph-representation\">graph-representation</a>、<a class=\"wl\" href=\"#dfs\">dfs</a>、<a class=\"wl\" href=\"#bfs\">bfs</a></p>"}, {"id": "dfs-applications", "title": "DFS 的應用", "group": "概念頁", "path": "wiki/concepts/dfs-applications.md", "html": "<h1>DFS 的應用</h1>\n<h2>Connected components</h2>\n<ul>\n<li>DFS 找到起點能到達的所有 nodes；在無向圖中這叫 connected component <a class=\"cite\" href=\"#G1\">G1 p.52</a>。</li>\n</ul>\n<h2>Topological sorting（拓撲排序）</h2>\n<ul>\n<li>問題：要怎麼安裝套件才不違反相依需求（dependency requirements）？<a class=\"cite\" href=\"#G1\">G1 p.58</a></li>\n<li>目標：找到一個 vertices 的排列，使所有相依需求都被滿足；也就是如果 v 排在 w 前面，就沒有從 w 到 v 的邊 <a class=\"cite\" href=\"#G1\">G1 p.59</a>。</li>\n<li>前提：相依圖沒有 cycle，也就是 Directed Acyclic Graph（DAG）<a class=\"cite\" href=\"#G1\">G1 p.59</a>。</li>\n<li>定理：在 DAG 上做 DFS，如果有邊 A → B，則 B.finishTime &lt; A.finishTime <a class=\"cite\" href=\"#G1\">G1 p.66</a>。</li>\n<li>所以照 DFS finish time 的反序安裝即可 <a class=\"cite\" href=\"#G1\">G1 p.67</a>。</li>\n<li>做法：做 DFS，每當一個 vertex 標成 all done，就把它放到串列最前面 <a class=\"cite\" href=\"#G1\">G1 p.68</a>。</li>\n<li>講義範例得到的順序：dpkg、coreutils、tar、libbz2、libselinux1、multiarch_support <a class=\"cite\" href=\"#G1\">G1 p.68</a>。</li>\n</ul>\n<h2>In-order traversal of BSTs</h2>\n<ul>\n<li>講義大綱與 Recap 列出 DFS 也可用於 BST 的 in-order traversal <a class=\"cite\" href=\"#G1\">G1 p.2</a><a class=\"cite\" href=\"#G1\">G1 p.119</a>。</li>\n<li>本份講義的文字中沒有展開這部分（講義未提供細節）；BST 與 inorder 見 <a class=\"wl\" href=\"#tree-traversal\">tree-traversal</a> <a class=\"cite\" href=\"#G1\">G1 p.119</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#dfs\">dfs</a></p>"}, {"id": "dfs-nonrecursive", "title": "非遞迴 DFS（用 Stack）", "group": "概念頁", "path": "wiki/concepts/dfs-nonrecursive.md", "html": "<h1>非遞迴 DFS（用 Stack）</h1>\n<ul>\n<li>G2 給出不用遞迴、改用 stack 的 DFS 演算法 <a class=\"cite\" href=\"#G2\">G2 p.3</a>。</li>\n</ul>\n<p><a class=\"cite\" href=\"#G2\">G2 p.3</a></p>\n<pre><code>Algorithm dfs(v)\n    s.createStack();\n    s.push(v);\n    mark v as visited;\n    while (!s.isEmpty()) {\n        let x be the node on the top of the stack s;\n        if (no unvisited nodes are adjacent to x)\n            s.pop();            // backtrack\n        else {\n            select an unvisited node u adjacent to x;\n            s.push(u);\n            mark u as visited;\n        }\n    }\n</code></pre>\n<ul>\n<li>重點：看 stack 頂端的 node；還有沒拜訪的鄰居就 push 進去往深處走，沒有就 pop（backtrack）<a class=\"cite\" href=\"#G2\">G2 p.3</a>。</li>\n</ul>\n<h2>範例：在圖 G 上從 v3 開始（<a class=\"wl\" href=\"#example-graph-g\">example-graph-g</a>）<a class=\"cite\" href=\"#G2\">G2 p.4</a></h2>\n<table>\n<thead>\n<tr>\n<th>動作</th>\n<th>stack</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>visit v3</td>\n<td>v3 <a class=\"cite\" href=\"#G2\">G2 p.4</a></td>\n</tr>\n<tr>\n<td>visit v2</td>\n<td>v3, v2 <a class=\"cite\" href=\"#G2\">G2 p.4</a></td>\n</tr>\n<tr>\n<td>visit v1</td>\n<td>v3, v2, v1 <a class=\"cite\" href=\"#G2\">G2 p.4</a></td>\n</tr>\n<tr>\n<td>backtrack</td>\n<td>v3, v2 <a class=\"cite\" href=\"#G2\">G2 p.4</a></td>\n</tr>\n<tr>\n<td>visit v4</td>\n<td>v3, v2, v4 <a class=\"cite\" href=\"#G2\">G2 p.4</a></td>\n</tr>\n<tr>\n<td>visit v5</td>\n<td>v3, v2, v4, v5 <a class=\"cite\" href=\"#G2\">G2 p.4</a></td>\n</tr>\n<tr>\n<td>backtrack ×3</td>\n<td>v3, v2, v4 → v3, v2 → v3 <a class=\"cite\" href=\"#G2\">G2 p.4</a></td>\n</tr>\n<tr>\n<td>backtrack</td>\n<td>empty <a class=\"cite\" href=\"#G2\">G2 p.4</a></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>拜訪順序：v3, v2, v1, v4, v5 <a class=\"cite\" href=\"#G2\">G2 p.4</a>。</li>\n</ul>\n<blockquote>\n<p>⚠ 與 G1 的差異：G1 的 DFS 是遞迴版並記錄 start／finish time <a class=\"cite\" href=\"#G1\">G1 p.43</a>，G1 也說明迭代版要看課本 <a class=\"cite\" href=\"#G1\">G1 p.51</a>；G2 的非遞迴版不記錄時間 <a class=\"cite\" href=\"#G2\">G2 p.3</a>。</p>\n</blockquote>\n<p>相關：<a class=\"wl\" href=\"#dfs\">dfs</a>、<a class=\"wl\" href=\"#stack-and-queue\">stack-and-queue</a></p>"}, {"id": "dfs", "title": "深度優先搜尋（Depth-First Search, DFS）", "group": "概念頁", "path": "wiki/concepts/dfs.md", "html": "<h1>深度優先搜尋（Depth-First Search, DFS）</h1>\n<h2>直覺</h2>\n<ul>\n<li>講義用「拿粉筆和一條線探索迷宮」說明 DFS <a class=\"cite\" href=\"#G1\">G1 p.26</a>。</li>\n<li>每個地點有三種狀態：還沒去過（Not been there yet）、去過但出口還沒探完、去過且出口都探完 <a class=\"cite\" href=\"#G1\">G1 p.26</a>。</li>\n<li>講義用一連串投影片一步一步示範這個迷宮怎麼被探索（explored）<a class=\"cite\" href=\"#G1\">G1 p.26-41</a>。</li>\n<li>叫 depth-first 是因為「先盡量往深處走」（go as deep as we can），過程中隱含地建出一棵 DFS tree <a class=\"cite\" href=\"#G1\">G1 p.54</a>。</li>\n</ul>\n<h2>遞迴版虛擬碼（有 start/finish time）</h2>\n<ul>\n<li>每個 vertex 記錄狀態：Unvisited、In progress、All done，以及第一次進入的時間與完成的時間 <a class=\"cite\" href=\"#G1\">G1 p.42</a>。</li>\n<li>講義說明這種寫法的 bookkeeping 比較多，但之後的應用會用到 <a class=\"cite\" href=\"#G1\">G1 p.42</a>。</li>\n</ul>\n<p><a class=\"cite\" href=\"#G1\">G1 p.43</a></p>\n<pre><code>DFS(w, currentTime):\n    w.startTime = currentTime\n    currentTime++\n    Mark w as in progress\n    for v in w.neighbors:\n        if v is unvisited:\n            currentTime = DFS(v, currentTime)\n            currentTime++\n    w.finishTime = currentTime\n    Mark w as all done\n    return currentTime\n</code></pre>\n<h2>性質</h2>\n<ul>\n<li>DFS 會找到從起點出發能到達的所有 nodes；在無向圖中這叫 connected component <a class=\"cite\" href=\"#G1\">G1 p.52</a>。</li>\n<li>要探索整張圖（explore the whole graph），講義的做法是重複做（Do it repeatedly）<a class=\"cite\" href=\"#G1\">G1 p.53</a>。</li>\n<li>DFS 在 directed graph 上也能用；講義例子是只走到 C、不走到 B <a class=\"cite\" href=\"#G1\">G1 p.57</a>。</li>\n</ul>\n<h2>執行時間</h2>\n<ul>\n<li>每條 edge 最多看兩次（兩個端點各一次），每個 vertex 最多拜訪一次，所以是 O(m+n) <a class=\"cite\" href=\"#G1\">G1 p.55</a>。</li>\n<li>以 linked-list 格式的圖計算：每個 vertex 做 O(1) 的 bookkeeping 加上 O(deg(w)) 檢查 neighbors，總共 O(n + m) <a class=\"cite\" href=\"#G1\">G1 p.56</a>。</li>\n</ul>\n<blockquote>\n<p>⚠ 兩種寫法：G1 用遞迴並記錄 start/finish time，並說明「這不是唯一的寫法，迭代版見課本」<a class=\"cite\" href=\"#G1\">G1 p.51</a>；G2 給的是用 stack 的非遞迴版本，見 <a class=\"wl\" href=\"#dfs-nonrecursive\">dfs-nonrecursive</a> <a class=\"cite\" href=\"#G2\">G2 p.3</a>。</p>\n</blockquote>\n<p>相關：<a class=\"wl\" href=\"#dfs-applications\">dfs-applications</a>、<a class=\"wl\" href=\"#bfs\">bfs</a>、<a class=\"wl\" href=\"#stack-and-queue\">stack-and-queue</a></p>"}, {"id": "example-graph-g", "title": "範例圖 G（G2 的 v1–v5）", "group": "概念頁", "path": "wiki/concepts/example-graph-g.md", "html": "<h1>範例圖 G（G2 的 v1–v5）</h1>\n<ul>\n<li>G2 的 DFS 與 BFS 範例都用名為 G 的圖，vertices 是 v1, v2, v3, v4, v5（圖是否相同、是否無向需看圖）<a class=\"cite\" href=\"#G2\">G2 p.2</a><a class=\"cite\" href=\"#G2\">G2 p.7</a>。</li>\n<li>邊（從 G2 p.2 的圖讀出，文字抽取無法驗證，需看圖）：v1–v2、v2–v3、v2–v4、v3–v4、v3–v5、v4–v5 <a class=\"cite\" href=\"#G2\">G2 p.2</a>。</li>\n<li>註（wiki）：上面 6 條邊已由使用者親自看 G2 p.2 原圖確認（2026-11-23）。</li>\n<li>DFS 從 v3 開始的拜訪順序：v3, v2, v1, v4, v5 <a class=\"cite\" href=\"#G2\">G2 p.4</a>。</li>\n<li>BFS 從 v5 開始的拜訪順序：v5, v3, v4, v2, v1 <a class=\"cite\" href=\"#G2\">G2 p.7</a>。</li>\n<li>講義沒有說明有多個 unvisited 鄰居時選哪一個（講義未提供）<a class=\"cite\" href=\"#G2\">G2 p.3</a>；<a class=\"cite\" href=\"#G2\">G2 p.3</a></li>\n<li>註（wiki）：用上面看圖讀出的邊、照「編號小的先選」跑 G2 的演算法，結果與講義 p.4、p.7 的順序一致；見 scripts/check_traversal.py。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#dfs-nonrecursive\">dfs-nonrecursive</a>、<a class=\"wl\" href=\"#bfs-queue\">bfs-queue</a></p>"}, {"id": "graph-basics", "title": "圖（Graph）的基本定義", "group": "概念頁", "path": "wiki/concepts/graph-basics.md", "html": "<h1>圖（Graph）的基本定義</h1>\n<h2>Undirected graph（無向圖）</h2>\n<ul>\n<li>無向圖 G 由頂點集合 V（vertices）與邊集合 E（edges）組成，寫成 G = (V,E) <a class=\"cite\" href=\"#G1\">G1 p.16</a>。</li>\n<li>一個 vertex 的 degree 是連出去的邊數；有邊相連的 vertices 稱為 neighbors <a class=\"cite\" href=\"#G1\">G1 p.16</a>。</li>\n<li>例子：V = {1,2,3,4}，E = { {1,3}, {2,4}, {3,4}, {2,3} }；vertex 4 的 degree 是 2，neighbors 是 2 和 3 <a class=\"cite\" href=\"#G1\">G1 p.16</a>。</li>\n</ul>\n<h2>Directed graph（有向圖）</h2>\n<ul>\n<li>有向圖的邊有方向（DIRECTED edges），同樣寫成 G = (V,E) <a class=\"cite\" href=\"#G1\">G1 p.17</a>。</li>\n<li>in-degree 是進來的邊數，out-degree 是出去的邊數 <a class=\"cite\" href=\"#G1\">G1 p.17</a>。</li>\n<li>例子：E = { (1,3), (2,4), (3,4), (4,3), (3,2) }；vertex 4 的 in-degree 是 2、out-degree 是 1 <a class=\"cite\" href=\"#G1\">G1 p.17</a>。</li>\n</ul>\n<h2>為什麼要學</h2>\n<ul>\n<li>圖可以描述 internet、航班、套件相依、大腦神經連結等 <a class=\"cite\" href=\"#G1\">G1 p.4-14</a>。</li>\n<li>我們想對圖回答問題，例如 routing、community detection、選課先修限制 <a class=\"cite\" href=\"#G1\">G1 p.15</a>。</li>\n</ul>\n<h2>與樹的關係</h2>\n<ul>\n<li>樹（tree）的定義：有一個 root，其餘 nodes 分成互不相交的 subtrees <a class=\"cite\" href=\"#C5\">C5 p.4</a>。</li>\n<li>講義中 DFS 與 BFS 執行時都會「隱含地建出一棵樹」，稱為 DFS tree / BFS tree，見 <a class=\"wl\" href=\"#dfs\">dfs</a>、<a class=\"wl\" href=\"#bfs\">bfs</a> <a class=\"cite\" href=\"#G1\">G1 p.54</a><a class=\"cite\" href=\"#G1\">G1 p.89</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#graph-representation\">graph-representation</a>、<a class=\"wl\" href=\"#tree-traversal\">tree-traversal</a></p>"}, {"id": "graph-representation", "title": "圖的表示法：Adjacency Matrix 與 Adjacency List", "group": "概念頁", "path": "wiki/concepts/graph-representation.md", "html": "<h1>圖的表示法：Adjacency Matrix 與 Adjacency List</h1>\n<h2>Option 1：Adjacency matrix（相鄰矩陣）</h2>\n<ul>\n<li>用 0/1 矩陣表示，列與行都是 vertices 1–4；對照 <a class=\"cite\" href=\"#G1\">G1 p.16</a> 的邊集合，1 出現在有邊的位置 <a class=\"cite\" href=\"#G1\">G1 p.16</a><a class=\"cite\" href=\"#G1\">G1 p.18</a>。</li>\n<li>有向圖時列代表 Source、行代表 Destination <a class=\"cite\" href=\"#G1\">G1 p.20</a>。</li>\n</ul>\n<h2>Option 2：Adjacency list（相鄰串列）</h2>\n<ul>\n<li>每個 vertex 存一串 neighbors；例如 4 的 neighbors 是 2 和 3 <a class=\"cite\" href=\"#G1\">G1 p.21</a>。</li>\n<li>講義計算 DFS 執行時間時，假設圖用 linked-list format 儲存 <a class=\"cite\" href=\"#G1\">G1 p.56</a>；linked list 本身見 C4 <a class=\"cite\" href=\"#C4\">C4 p.2</a>。</li>\n</ul>\n<h2>兩種都支援的基本操作</h2>\n<ul>\n<li>Edge Membership：邊 e 是否在 E 裡？Neighbor Query：vertex v 的 neighbors 是誰？<a class=\"cite\" href=\"#G1\">G1 p.22</a></li>\n<li>vertices 也可以存其他資訊，例如名稱、IP address、演算法用的輔助資訊 <a class=\"cite\" href=\"#G1\">G1 p.22</a>。</li>\n</ul>\n<h2>取捨（n 個 vertices、m 條 edges）<a class=\"cite\" href=\"#G1\">G1 p.23</a></h2>\n<table>\n<thead>\n<tr>\n<th>操作</th>\n<th>Adjacency matrix</th>\n<th>Adjacency list</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Edge membership</td>\n<td>O(1) <a class=\"cite\" href=\"#G1\">G1 p.23</a></td>\n<td>O(deg(v)) 或 O(deg(w)) <a class=\"cite\" href=\"#G1\">G1 p.23</a></td>\n</tr>\n<tr>\n<td>Neighbor query</td>\n<td>O(n) <a class=\"cite\" href=\"#G1\">G1 p.23</a></td>\n<td>O(deg(v)) <a class=\"cite\" href=\"#G1\">G1 p.23</a></td>\n</tr>\n<tr>\n<td>Space</td>\n<td>O(n^2) <a class=\"cite\" href=\"#G1\">G1 p.23</a></td>\n<td>O(n + m) <a class=\"cite\" href=\"#G1\">G1 p.23</a></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>adjacency list 通常較適合 sparse graph（m ≪ n^2）<a class=\"cite\" href=\"#G1\">G1 p.23</a>。</li>\n<li>講義在 adjacency list 那一欄註明：之後整門課都假設用這個表示法（this representation）<a class=\"cite\" href=\"#G1\">G1 p.23</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#graph-basics\">graph-basics</a>、<a class=\"wl\" href=\"#big-o\">big-o</a></p>"}, {"id": "stack-and-queue", "title": "Stack 與 Queue", "group": "概念頁", "path": "wiki/concepts/stack-and-queue.md", "html": "<h1>Stack 與 Queue</h1>\n<h2>Stack（堆疊）</h2>\n<ul>\n<li>Stack 是 Last-In-First-Out（LIFO），只有一端可以進出 <a class=\"cite\" href=\"#C3\">C3 p.4</a>。</li>\n<li>操作：IsEmpty、Top（看頂端）、Push（放到頂端）、Pop（移除頂端）<a class=\"cite\" href=\"#C3\">C3 p.6</a>。</li>\n<li>可以用 linked list 實作：Push 就是在 top 前面接一個新 node <a class=\"cite\" href=\"#C4\">C4 p.19-20</a>。</li>\n</ul>\n<h2>Queue（佇列）</h2>\n<ul>\n<li>Queue 是 First-In-First-Out（FIFO）：資料從 rear 進、從 front 出 <a class=\"cite\" href=\"#C3\">C3 p.15</a>。</li>\n<li>Linear queue 的問題：前面還有空位，rear 卻已到底而 overflow <a class=\"cite\" href=\"#C3\">C3 p.16</a>。</li>\n<li>Circular queue：n 個位置最多只用 n-1 個，否則無法分辨滿和空 <a class=\"cite\" href=\"#C3\">C3 p.18</a>。</li>\n<li>也可以用 linked list 實作：Push 接在 rear、Pop 從 front 刪除 <a class=\"cite\" href=\"#C4\">C4 p.21-22</a>。</li>\n</ul>\n<h2>和走訪的關係</h2>\n<ul>\n<li>非遞迴 DFS 用 stack：看頂端、push 新 node、沒路就 pop <a class=\"cite\" href=\"#G2\">G2 p.3</a>。</li>\n<li>BFS 用 queue：dequeue 一個 node，把它沒拜訪過的鄰居 enqueue <a class=\"cite\" href=\"#G2\">G2 p.6</a>。</li>\n<li>二元樹的 preorder、inorder、postorder 都需要 stack；level-order 用 queue <a class=\"cite\" href=\"#C5\">C5 p.22</a>。</li>\n</ul>\n<h2>迷宮問題（A Mazing Problem）</h2>\n<ul>\n<li>C3 用一個 0／1 迷宮矩陣示範用 stack 記錄走過的位置（row、col、dir）<a class=\"cite\" href=\"#C3\">C3 p.29</a><a class=\"cite\" href=\"#C3\">C3 p.31</a>。</li>\n<li>每格可以走的方向（Allowable Moves）：N、NE、E、SE、S、SW、W、NW <a class=\"cite\" href=\"#C3\">C3 p.30</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#dfs-nonrecursive\">dfs-nonrecursive</a>、<a class=\"wl\" href=\"#bfs-queue\">bfs-queue</a>、<a class=\"wl\" href=\"#tree-traversal\">tree-traversal</a></p>"}, {"id": "tree-traversal", "title": "樹的走訪（Tree Traversal）", "group": "概念頁", "path": "wiki/concepts/tree-traversal.md", "html": "<h1>樹的走訪（Tree Traversal）</h1>\n<h2>樹的術語</h2>\n<ul>\n<li>樹有一個 root，其餘 nodes 分成互不相交的 subtrees <a class=\"cite\" href=\"#C5\">C5 p.4</a>。</li>\n<li>degree 是一個 node 的 subtree 數；leaf 是 degree 為零的 node <a class=\"cite\" href=\"#C5\">C5 p.6</a>。</li>\n<li>root 的 level 是 1，height（depth）是 nodes 的最大 level <a class=\"cite\" href=\"#C5\">C5 p.7</a>。</li>\n</ul>\n<h2>三種遞迴走訪（Binary tree）</h2>\n<ul>\n<li>Preorder：root → left subtree → right subtree <a class=\"cite\" href=\"#C5\">C5 p.16</a>。</li>\n<li>Inorder：left subtree → root → right subtree <a class=\"cite\" href=\"#C5\">C5 p.16</a>。</li>\n<li>Postorder：left subtree → right subtree → root <a class=\"cite\" href=\"#C5\">C5 p.16</a>。</li>\n<li>在算術運算式樹上，三者分別得到 prefix、infix、postfix 運算式 <a class=\"cite\" href=\"#C5\">C5 p.17</a>。</li>\n</ul>\n<p><a class=\"cite\" href=\"#C5\">C5 p.19</a></p>\n<pre><code>void Tree&lt;T&gt;::Inorder(TreeNode&lt;T&gt; *currentNode) {\n    if (currentNode) {\n        Inorder(currentNode-&gt;leftChild);\n        Visit(currentNode);\n        Inorder(currentNode-&gt;rightChild);\n    }\n}\n</code></pre>\n<h2>用 stack 的非遞迴 inorder</h2>\n<ul>\n<li>C5 用 stack 模擬遞迴來做非遞迴 inorder <a class=\"cite\" href=\"#C5\">C5 p.21</a>。</li>\n</ul>\n<blockquote>\n<p>⚠ 講義內部不一致：C5 p.21 的註解寫「move down leftChild fields」，但同一迴圈的程式碼寫的是 <code>currentNode = currentNode-&gt;rightChild</code> <a class=\"cite\" href=\"#C5\">C5 p.21</a>。依 inorder 的定義（先走 left subtree）<a class=\"cite\" href=\"#C5\">C5 p.16</a>，註解與程式碼至少有一處有誤；本 wiki 不替講義改。</p>\n</blockquote>\n<h2>Level-order（用 queue）</h2>\n<ul>\n<li>Preorder、inorder、postorder 都需要 stack；level-order 用 queue <a class=\"cite\" href=\"#C5\">C5 p.22</a>。</li>\n<li>一層的 nodes 都拜訪完才往下一層 <a class=\"cite\" href=\"#C5\">C5 p.22</a>。</li>\n<li>講義例子的 level-order 結果：+<em>E</em>D/CAB <a class=\"cite\" href=\"#C5\">C5 p.23</a>。</li>\n<li>G2 指出 BFS 和 level-order 相似，也是以 queue 為基礎 <a class=\"cite\" href=\"#G2\">G2 p.5</a>。</li>\n</ul>\n<h2>BST 與 inorder</h2>\n<ul>\n<li>Binary search tree：左 subtree 的 key 都比 root 小，右 subtree 都比 root 大，且左右也都是 BST <a class=\"cite\" href=\"#C5\">C5 p.37</a>。</li>\n<li>G1 的大綱與 Recap 列出「DFS 用於 BST 的 in-order traversal」<a class=\"cite\" href=\"#G1\">G1 p.2</a><a class=\"cite\" href=\"#G1\">G1 p.119</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#stack-and-queue\">stack-and-queue</a>、<a class=\"wl\" href=\"#bfs-queue\">bfs-queue</a>、<a class=\"wl\" href=\"#dfs\">dfs</a>、<a class=\"wl\" href=\"#graph-basics\">graph-basics</a></p>"}, {"id": "G1", "title": "G1 · Lecture 9: Graphs, BFS and DFS", "group": "來源頁", "path": "wiki/sources/G1.md", "html": "<pre><code>source: G1\nfile: raw/pdf/G1-graph-part1.pdf\npages: 119\nlevel: 深度\n</code></pre>\n<h1>G1 · Lecture 9: Graphs, BFS and DFS</h1>\n<ul>\n<li>大綱分三部分：Part 0 圖與術語、Part 1 深度優先搜尋（DFS）、Part 2 廣度優先搜尋（BFS）<a class=\"cite\" href=\"#G1\">G1 p.2</a>。</li>\n<li>DFS 的應用：topological sorting、BST 的 in-order traversal <a class=\"cite\" href=\"#G1\">G1 p.2</a>。</li>\n<li>BFS 的應用：shortest paths、判斷圖是否 bipartite <a class=\"cite\" href=\"#G1\">G1 p.2</a>。</li>\n<li>開頭用許多真實例子說明圖無所不在：internet、Game of Thrones 角色互動、航班、套件相依、大腦神經連結等 <a class=\"cite\" href=\"#G1\">G1 p.4-14</a>。</li>\n<li>想回答的問題包括 routing、community detection、Bacon number、不違反先修規則的選課 <a class=\"cite\" href=\"#G1\">G1 p.15</a>。</li>\n<li>圖的定義與表示法見 <a class=\"wl\" href=\"#graph-basics\">graph-basics</a>、<a class=\"wl\" href=\"#graph-representation\">graph-representation</a> <a class=\"cite\" href=\"#G1\">G1 p.16-23</a>。</li>\n<li>DFS 以「迷宮裡的粉筆與線」說明，見 <a class=\"wl\" href=\"#dfs\">dfs</a> <a class=\"cite\" href=\"#G1\">G1 p.26</a>。</li>\n<li>BFS 以「鳥瞰（bird's-eye view）」說明，見 <a class=\"wl\" href=\"#bfs\">bfs</a> <a class=\"cite\" href=\"#G1\">G1 p.81</a>。</li>\n<li>應用見 <a class=\"wl\" href=\"#dfs-applications\">dfs-applications</a>、<a class=\"wl\" href=\"#bfs-applications\">bfs-applications</a> <a class=\"cite\" href=\"#G1\">G1 p.119</a>。</li>\n<li>講義提到可參考 Lecture 9 IPython notebook 的實作 <a class=\"cite\" href=\"#G1\">G1 p.23</a><a class=\"cite\" href=\"#G1\">G1 p.68</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#G2\">G2</a></p>"}, {"id": "G2", "title": "G2 · Nonrecursive DFS and BFS", "group": "來源頁", "path": "wiki/sources/G2.md", "html": "<pre><code>source: G2\nfile: raw/pdf/G2-graph-dfs-bfs.pdf\npages: 7\nlevel: 深度\n</code></pre>\n<h1>G2 · Nonrecursive DFS and BFS</h1>\n<ul>\n<li>給出不用遞迴的 DFS（用 stack）與 BFS（用 queue）演算法 <a class=\"cite\" href=\"#G2\">G2 p.3</a><a class=\"cite\" href=\"#G2\">G2 p.6</a>。</li>\n<li>兩個完整範例都用同一張圖 G（v1–v5）：DFS 從 v3 開始、BFS 從 v5 開始，並列出每一步的 stack／queue 內容 <a class=\"cite\" href=\"#G2\">G2 p.4</a><a class=\"cite\" href=\"#G2\">G2 p.7</a>。</li>\n<li>範例圖的走訪順序整理在 <a class=\"wl\" href=\"#example-graph-g\">example-graph-g</a>（邊只畫在圖上，需看圖）<a class=\"cite\" href=\"#G2\">G2 p.4</a><a class=\"cite\" href=\"#G2\">G2 p.7</a>。</li>\n<li>把 BFS 比作 tree 的 level-order traversal <a class=\"cite\" href=\"#G2\">G2 p.5</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#dfs-nonrecursive\">dfs-nonrecursive</a>、<a class=\"wl\" href=\"#bfs-queue\">bfs-queue</a>、<a class=\"wl\" href=\"#G1\">G1</a></p>"}, {"id": "C3", "title": "C3 · Chapter 3: Stacks and Queues", "group": "來源頁", "path": "wiki/sources/C3.md", "html": "<pre><code>source: C3\nfile: raw/pdf/C3-ch03-stacks-queues.pdf\npages: 47\nlevel: 深度\n</code></pre>\n<h1>C3 · Chapter 3: Stacks and Queues</h1>\n<ul>\n<li>C++ templates 與 selection sort template <a class=\"cite\" href=\"#C3\">C3 p.2-3</a>。</li>\n<li>Stack（LIFO）與 Queue（FIFO）的定義與操作 <a class=\"cite\" href=\"#C3\">C3 p.4-6</a><a class=\"cite\" href=\"#C3\">C3 p.15</a><a class=\"cite\" href=\"#C3\">C3 p.19</a>。</li>\n<li>應用：括號檢查（Parentheses Check）<a class=\"cite\" href=\"#C3\">C3 p.7-8</a>。</li>\n<li>用 array 實作 stack <a class=\"cite\" href=\"#C3\">C3 p.10-14</a>；linear queue、circular queue 與 array 實作 queue <a class=\"cite\" href=\"#C3\">C3 p.16-23</a>。</li>\n<li>C++ class inheritance <a class=\"cite\" href=\"#C3\">C3 p.24-28</a>。</li>\n<li>迷宮問題（A Mazing Problem）用 stack 求解 <a class=\"cite\" href=\"#C3\">C3 p.29-31</a>。</li>\n<li>Infix、postfix、prefix 運算式；expression tree；用 stack 計算 postfix、infix 轉 postfix <a class=\"cite\" href=\"#C3\">C3 p.32-45</a>。</li>\n<li>Stack 與 Queue 的重點整理在 <a class=\"wl\" href=\"#stack-and-queue\">stack-and-queue</a> <a class=\"cite\" href=\"#C3\">C3 p.4</a>。</li>\n</ul>"}, {"id": "C4", "title": "C4 · Chapter 4: Linked Lists", "group": "來源頁", "path": "wiki/sources/C4.md", "html": "<pre><code>source: C4\nfile: raw/pdf/C4-ch04-linked-lists.pdf\npages: 50\nlevel: 深度\n</code></pre>\n<h1>C4 · Chapter 4: Linked Lists</h1>\n<ul>\n<li>Singly linked list（chain）：node 的表示、插入、刪除 <a class=\"cite\" href=\"#C4\">C4 p.2-10</a>。</li>\n<li>Template class chain：tail 插入、串接、反轉 <a class=\"cite\" href=\"#C4\">C4 p.11-15</a>。</li>\n<li>Circular list <a class=\"cite\" href=\"#C4\">C4 p.17-18</a>。</li>\n<li>Linked stacks and queues：Push／Pop 的實作 <a class=\"cite\" href=\"#C4\">C4 p.19-22</a>。</li>\n<li>應用：polynomials 相加、equivalence class、sparse matrix <a class=\"cite\" href=\"#C4\">C4 p.23-36</a>。</li>\n<li>Doubly linked list <a class=\"cite\" href=\"#C4\">C4 p.37-40</a>；generalized lists 與 reference counts <a class=\"cite\" href=\"#C4\">C4 p.41-50</a>。</li>\n<li>Linked stack 與 linked queue 的重點整理在 <a class=\"wl\" href=\"#stack-and-queue\">stack-and-queue</a> <a class=\"cite\" href=\"#C4\">C4 p.19</a>。</li>\n</ul>"}, {"id": "C5", "title": "C5 · Chapter 5: Trees", "group": "來源頁", "path": "wiki/sources/C5.md", "html": "<pre><code>source: C5\nfile: raw/pdf/C5-ch05-trees.pdf\npages: 57\nlevel: 深度\n</code></pre>\n<h1>C5 · Chapter 5: Trees</h1>\n<ul>\n<li>Tree 的定義與術語；list 與 left child-right sibling 表示法 <a class=\"cite\" href=\"#C5\">C5 p.4-9</a>。</li>\n<li>Binary trees：full／complete、array 與 linked 表示 <a class=\"cite\" href=\"#C5\">C5 p.10-15</a>。</li>\n<li>走訪：preorder、inorder、postorder、非遞迴 inorder、level-order <a class=\"cite\" href=\"#C5\">C5 p.16-23</a>。</li>\n<li>Threaded binary tree <a class=\"cite\" href=\"#C5\">C5 p.24-30</a>。</li>\n<li>Priority queue 與 max／min heap <a class=\"cite\" href=\"#C5\">C5 p.31-36</a>。</li>\n<li>Binary search tree：搜尋、插入、刪除 <a class=\"cite\" href=\"#C5\">C5 p.37-43</a>。</li>\n<li>Selection trees（winner／loser tree）、forests、不同 binary trees 的個數 <a class=\"cite\" href=\"#C5\">C5 p.44-57</a>。</li>\n<li>Binary tree traversal 整理在 <a class=\"wl\" href=\"#tree-traversal\">tree-traversal</a> <a class=\"cite\" href=\"#C5\">C5 p.16</a>。</li>\n<li>⚠ p.21 的註解與程式碼不一致，見 <a class=\"wl\" href=\"#tree-traversal\">tree-traversal</a> <a class=\"cite\" href=\"#C5\">C5 p.21</a>。</li>\n</ul>"}, {"id": "C1", "title": "C1 · Chapter 1: Basic Concepts", "group": "來源頁", "path": "wiki/sources/C1.md", "html": "<pre><code>source: C1\nfile: raw/pdf/C1-ch01-basic-concepts_1.pdf\npages: 35\nlevel: 深度\n</code></pre>\n<h1>C1 · Chapter 1: Basic Concepts</h1>\n<ul>\n<li>Bit、data type、1's 與 2's complement <a class=\"cite\" href=\"#C1\">C1 p.2-4</a>。</li>\n<li>Abstract Data Type（ADT）<a class=\"cite\" href=\"#C1\">C1 p.5-6</a>。</li>\n<li>遞迴與迭代：factorial、binary search、permutation、Fibonacci、Towers of Hanoi <a class=\"cite\" href=\"#C1\">C1 p.7-27</a>。</li>\n<li>Asymptotic O notation、函數成長表、time／space complexity <a class=\"cite\" href=\"#C1\">C1 p.28-30</a>。</li>\n<li>Selection sort 與時間量測 <a class=\"cite\" href=\"#C1\">C1 p.31-35</a>。</li>\n<li>複雜度的部分整理在 <a class=\"wl\" href=\"#big-o\">big-o</a> <a class=\"cite\" href=\"#C1\">C1 p.28</a>。</li>\n</ul>"}, {"id": "C2", "title": "C2 · Chapter 2: Arrays（輕量）", "group": "來源頁", "path": "wiki/sources/C2.md", "html": "<pre><code>source: C2\nfile: raw/pdf/C2-ch02-arrays.pdf\npages: 40\nlevel: 輕量\n</code></pre>\n<h1>C2 · Chapter 2: Arrays（輕量）</h1>\n<h2>章節大綱</h2>\n<ul>\n<li>ADT 與 C++ class（Rectangle 範例、constructor、operator overloading）<a class=\"cite\" href=\"#C2\">C2 p.2-8</a>。</li>\n<li>Array as ADT、一維陣列 <a class=\"cite\" href=\"#C2\">C2 p.9-11</a>。</li>\n<li>二維陣列與 row-major／column-major order 的記憶體對應 <a class=\"cite\" href=\"#C2\">C2 p.13-17</a>。</li>\n<li>Sets、polynomial 的表示與相加 <a class=\"cite\" href=\"#C2\">C2 p.18-24</a>。</li>\n<li>Sparse matrix 的表示、transpose、faster transpose、矩陣乘法 <a class=\"cite\" href=\"#C2\">C2 p.25-36</a>。</li>\n<li>String 與 KMP 字串比對 <a class=\"cite\" href=\"#C2\">C2 p.37-40</a>。</li>\n</ul>\n<h2>關鍵定義</h2>\n<ul>\n<li>2D array 可以畫成一張表，例如 int a[3][4] <a class=\"cite\" href=\"#C2\">C2 p.13</a>。</li>\n<li>Row-major order：把 2D 陣列一列一列地存成 1D <a class=\"cite\" href=\"#C2\">C2 p.14</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#graph-representation\">graph-representation</a>、<a class=\"wl\" href=\"#C4\">C4</a></p>"}, {"id": "C7", "title": "C7 · Chapter 7: Sorting（輕量）", "group": "來源頁", "path": "wiki/sources/C7.md", "html": "<pre><code>source: C7\nfile: raw/pdf/C7-ch07-sorting.pdf\npages: 58\nlevel: 輕量\n</code></pre>\n<h1>C7 · Chapter 7: Sorting（輕量）</h1>\n<h2>章節大綱</h2>\n<ul>\n<li>Sequential search 與排序的動機、分類 <a class=\"cite\" href=\"#C7\">C7 p.2-7</a>。</li>\n<li>Insertion sort <a class=\"cite\" href=\"#C7\">C7 p.8-11</a>；Quick sort <a class=\"cite\" href=\"#C7\">C7 p.12-17</a>；Merge sort（迭代與遞迴）<a class=\"cite\" href=\"#C7\">C7 p.18-27</a>。</li>\n<li>Heap sort <a class=\"cite\" href=\"#C7\">C7 p.28-32</a>；Radix sort <a class=\"cite\" href=\"#C7\">C7 p.33-36</a>；List sort、table sort <a class=\"cite\" href=\"#C7\">C7 p.37-45</a>。</li>\n<li>External sorting 與 Huffman algorithm <a class=\"cite\" href=\"#C7\">C7 p.49-58</a>。</li>\n</ul>\n<h2>複雜度比較 <a class=\"cite\" href=\"#C7\">C7 p.47</a></h2>\n<table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Worst</th>\n<th>Average</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Insertion Sort</td>\n<td>n2 <a class=\"cite\" href=\"#C7\">C7 p.47</a></td>\n<td>n2 <a class=\"cite\" href=\"#C7\">C7 p.47</a></td>\n</tr>\n<tr>\n<td>Heap Sort</td>\n<td>n log n <a class=\"cite\" href=\"#C7\">C7 p.47</a></td>\n<td>n log n <a class=\"cite\" href=\"#C7\">C7 p.47</a></td>\n</tr>\n<tr>\n<td>Merge Sort</td>\n<td>n log n <a class=\"cite\" href=\"#C7\">C7 p.47</a></td>\n<td>n log n <a class=\"cite\" href=\"#C7\">C7 p.47</a></td>\n</tr>\n<tr>\n<td>Quick Sort</td>\n<td>n2 <a class=\"cite\" href=\"#C7\">C7 p.47</a></td>\n<td>n log n <a class=\"cite\" href=\"#C7\">C7 p.47</a></td>\n</tr>\n</tbody>\n</table>\n<h2>總結</h2>\n<ul>\n<li>沒有一種方法在所有情況都最好 <a class=\"cite\" href=\"#C7\">C7 p.46</a>。</li>\n<li>Insertion sort 適合已部分排序或 n 很小的情況 <a class=\"cite\" href=\"#C7\">C7 p.46</a>。</li>\n<li>Merge sort 的 worst-case 最好，但比 heap sort 需要更多儲存空間 <a class=\"cite\" href=\"#C7\">C7 p.46</a>。</li>\n<li>Quick sort 的 average 最好，但 worst-case 是 O(n2) <a class=\"cite\" href=\"#C7\">C7 p.46</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#big-o\">big-o</a>、<a class=\"wl\" href=\"#C7E\">C7E</a></p>"}, {"id": "C7E", "title": "C7E · Chapter 7: External Merge Sort（輕量）", "group": "來源頁", "path": "wiki/sources/C7E.md", "html": "<pre><code>source: C7E\nfile: raw/pdf/C7E-ch07-EMS.pdf\npages: 35\nlevel: 輕量\n</code></pre>\n<h1>C7E · Chapter 7: External Merge Sort（輕量）</h1>\n<h2>章節大綱</h2>\n<ul>\n<li>Section 1：Storage 與 memory、buffer <a class=\"cite\" href=\"#C7E\">C7E p.2-9</a>。</li>\n<li>Section 2：External Merge Algorithm <a class=\"cite\" href=\"#C7E\">C7E p.10-22</a>。</li>\n<li>Section 3：External Merge Sort <a class=\"cite\" href=\"#C7E\">C7E p.23-35</a>。</li>\n</ul>\n<h2>關鍵重點</h2>\n<ul>\n<li>External Merge Algorithm：輸入兩個長度 M、N 的已排序串列，輸出一個長度 M + N 的已排序串列 <a class=\"cite\" href=\"#C7E\">C7E p.11</a>。</li>\n<li>至少需要 3 個 Buffer Pages，IO 次數是 2(M+N) <a class=\"cite\" href=\"#C7E\">C7E p.11</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#C7\">C7</a></p>"}, {"id": "C8", "title": "C8 · Chapter 8: Hashing（輕量）", "group": "來源頁", "path": "wiki/sources/C8.md", "html": "<pre><code>source: C8\nfile: raw/pdf/C8-ch08-hashing.pdf\npages: 23\nlevel: 輕量\n</code></pre>\n<h1>C8 · Chapter 8: Hashing（輕量）</h1>\n<h2>章節大綱</h2>\n<ul>\n<li>Array 與 tree 的效能比較，引出「能不能 O(1)」的問題 <a class=\"cite\" href=\"#C8\">C8 p.2</a>。</li>\n<li>Static hashing：hash table、hash functions（division、mid-square、folding）<a class=\"cite\" href=\"#C8\">C8 p.3-8</a>。</li>\n<li>Overflow handling：linear probing、quadratic probing、rehashing、chaining <a class=\"cite\" href=\"#C8\">C8 p.9-13</a>。</li>\n<li>Dynamic hashing（有 directory 與 directoryless）<a class=\"cite\" href=\"#C8\">C8 p.14-23</a>。</li>\n</ul>\n<h2>關鍵定義</h2>\n<ul>\n<li>Hash function：把 key 轉成 table index，例如 h(k) = k mod 10 <a class=\"cite\" href=\"#C8\">C8 p.3</a>。</li>\n<li>Hash collision：兩個 keys 要放進同一個 bucket <a class=\"cite\" href=\"#C8\">C8 p.3</a>。</li>\n<li>Synonym：h(k1) = h(k2) 時 k1、k2 互為 synonyms <a class=\"cite\" href=\"#C8\">C8 p.4</a>。</li>\n<li>Open addressing 在表中依規則找沒滿的 bucket；chaining 讓每個 bucket 存一條 linked list <a class=\"cite\" href=\"#C8\">C8 p.9</a>。</li>\n<li>Linear probing：一格一格找下一個空 bucket，(h(k) + j) % D <a class=\"cite\" href=\"#C8\">C8 p.10</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#C4\">C4</a>、<a class=\"wl\" href=\"#big-o\">big-o</a></p>"}, {"id": "C10", "title": "C10 · Chapter 10: Efficient Binary Search Trees（輕量）", "group": "來源頁", "path": "wiki/sources/C10.md", "html": "<pre><code>source: C10\nfile: raw/pdf/C10-ch10-efficient-binary-search-trees.pdf\npages: 47\nlevel: 輕量\n</code></pre>\n<h1>C10 · Chapter 10: Efficient Binary Search Trees（輕量）</h1>\n<h2>章節大綱</h2>\n<ul>\n<li>Optimal BST：extended binary trees、search cost、建構演算法 <a class=\"cite\" href=\"#C10\">C10 p.2-8</a>。</li>\n<li>AVL trees 與四種 rotation（LL、RR、LR、RL）<a class=\"cite\" href=\"#C10\">C10 p.9-15</a>。</li>\n<li>Red-black trees：定義、性質、插入 <a class=\"cite\" href=\"#C10\">C10 p.17-30</a>。</li>\n<li>Splay trees（bottom-up 與 top-down）<a class=\"cite\" href=\"#C10\">C10 p.31-47</a>。</li>\n</ul>\n<h2>關鍵重點</h2>\n<ul>\n<li>AVL tree 是 height balanced 的 BST，每個 node 的 balance factor 是 −1、0 或 1 <a class=\"cite\" href=\"#C10\">C10 p.9</a>。</li>\n<li>AVL tree 的插入與刪除可以在 O(log n) 完成 <a class=\"cite\" href=\"#C10\">C10 p.9</a>。</li>\n<li>Red-black tree 是 extended binary search tree，node 或 edge 塗成 red 或 black <a class=\"cite\" href=\"#C10\">C10 p.17</a>。</li>\n<li>複雜度比較：AVL tree 的搜尋是 O(log n)，linked list 是 O(n) <a class=\"cite\" href=\"#C10\">C10 p.16</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#tree-traversal\">tree-traversal</a>、<a class=\"wl\" href=\"#C5\">C5</a>、<a class=\"wl\" href=\"#C11\">C11</a></p>"}, {"id": "C11", "title": "C11 · Chapter 11: Multiway Search Trees（輕量）", "group": "來源頁", "path": "wiki/sources/C11.md", "html": "<pre><code>source: C11\nfile: raw/pdf/C11-ch11-multiway-search-trees.pdf\npages: 25\nlevel: 輕量\n</code></pre>\n<h1>C11 · Chapter 11: Multiway Search Trees（輕量）</h1>\n<h2>章節大綱</h2>\n<ul>\n<li>m-way search tree 的定義與搜尋 <a class=\"cite\" href=\"#C11\">C11 p.2-4</a>。</li>\n<li>B-tree：定義、元素個數、插入、刪除 <a class=\"cite\" href=\"#C11\">C11 p.5-18</a>。</li>\n<li>B+-tree <a class=\"cite\" href=\"#C11\">C11 p.19-25</a>。</li>\n</ul>\n<h2>關鍵定義</h2>\n<ul>\n<li>m-way search tree：root 最多有 m 個 subtrees，keys 由小到大排列，每個 subtree 也是 m-way search tree <a class=\"cite\" href=\"#C11\">C11 p.2</a>。</li>\n<li>B-tree of order m：root 至少 2 個 children，所有 external nodes 在同一層 <a class=\"cite\" href=\"#C11\">C11 p.5</a>。</li>\n<li>2-3 tree 是 order 3 的 B-tree，2-3-4 tree 是 order 4 的 B-tree <a class=\"cite\" href=\"#C11\">C11 p.5</a>。</li>\n</ul>\n<p>相關：<a class=\"wl\" href=\"#C10\">C10</a>、<a class=\"wl\" href=\"#tree-traversal\">tree-traversal</a></p>"}, {"id": "interview", "title": "需求訪談紀錄（先討論）", "group": "過程紀錄", "path": "00-需求訪談紀錄.md", "html": "<h1>需求訪談紀錄（先討論、後生成）</h1>\n<blockquote>\n<p>規則：訪談完、使用者確認需求摘要之前，不建立任何 wiki 檔案。\n參考：Karpathy LLM Wiki gist（使用者提供）、課堂投影片第 30–32 頁。</p>\n</blockquote>\n<h2>過程</h2>\n<ul>\n<li>開場：使用者提供 17 份 CSE 215 資料結構講義＋Karpathy gist，要求「寫 AGENTS.md 前先理清想法、確認目標」。</li>\n<li>AI 先盤點檔案：17 份中 5 份是內容完全相同的重複檔（md5 相同）→ 實際 12 份、約 520 頁；全為英文、可抽文字。</li>\n<li>因截止時間，訪談改為兩輪、每輪 4 題（老師範本為一次一題）。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>問題</th>\n<th>回答</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>簡報教哪個單元？</td>\n<td>使用者問「哪一個分數最高」→ AI 建議 Graph 與 BFS/DFS（兩份講義可對照、前置章節串成一條線、適合做互動動畫）→ 採用</td>\n</tr>\n<tr>\n<td>2</td>\n<td>ingest 多少份？</td>\n<td>先選「只 ingest 5–6 份相關章」</td>\n</tr>\n<tr>\n<td>3</td>\n<td>語言？</td>\n<td>繁中，術語保留英文</td>\n</tr>\n<tr>\n<td>4</td>\n<td>出處粒度？</td>\n<td>標到講義頁碼</td>\n</tr>\n<tr>\n<td>5</td>\n<td>讀者？</td>\n<td>會一點程式、沒學過 Graph</td>\n</tr>\n<tr>\n<td>6</td>\n<td>兩份 Graph 講義矛盾怎麼辦？</td>\n<td>並列兩種說法並標註</td>\n</tr>\n<tr>\n<td>7</td>\n<td>程式碼怎麼收？</td>\n<td>關鍵虛擬碼＋複雜度</td>\n</tr>\n<tr>\n<td>8</td>\n<td>簡報要互動動畫嗎？</td>\n<td>要，用講義裡的範例圖</td>\n</tr>\n<tr>\n<td>—</td>\n<td>看到需求摘要後的修改</td>\n<td><strong>「我不要完全跳過」其他 6 份</strong> → 改為兩層：6 份深度＋6 份輕量</td>\n</tr>\n<tr>\n<td>—</td>\n<td>最終</td>\n<td>使用者回覆「確認」</td>\n</tr>\n</tbody>\n</table>\n<h2>需求摘要（確認版）</h2>\n<ol>\n<li>主題：CSE 215 資料結構 LLM Wiki；簡報單元：Graph 與 BFS/DFS。</li>\n<li>12 份全部 ingest：深度 6 份（G1, G2, C3, C4, C5, C1）＋輕量 6 份（C2, C7, C7E, C8, C10, C11）；5 份重複檔略過。</li>\n<li>繁中＋英文術語；讀者會一點程式。</li>\n<li>出處標到講義頁碼，腳本核對。</li>\n<li>矛盾並列標註。</li>\n<li>收關鍵虛擬碼＋複雜度。</li>\n<li>簡報含互動 BFS/DFS 動畫，範例圖與走訪順序取自講義並由腳本核對。</li>\n</ol>\n<h2>需求變更（2026-11-23 21:43，看過第一版簡報後）</h2>\n<ul>\n<li>使用者：「網頁設計太知識化，希望有趣一點，讓完全不會的人可以有興趣，可以適當增加一些照片」</li>\n<li>變更：簡報讀者從「會一點程式、沒學過 Graph」改為「完全不會的人」；加入圖片</li>\n<li>圖片規則：只用講義本身的圖（標頁碼），不用網路圖片；不放真人照片（G1 p.90 有演員照片 → 只用文字）</li>\n<li>有趣的來源：講義本身的故事（粉筆走迷宮、用飛的看世界、安裝套件、魚缸），不另外編比喻</li>\n</ul>\n<h2>事後確認訪談（2026-11-23 21:52，使用者要求「/grill me」：指出很多細節 AI 沒問就執行）</h2>\n<p>AI 先列出 9 個未經確認就做的決定，再逐題請使用者確認：\n| # | 問題 | 使用者決定 |\n|---|---|---|\n| 1 | 反思與繳交文字由 AI 以第一人稱代寫 | 改寫：明確區分「我決定了什麼」與「AI 做了什麼」 |\n| 2 | 反思要不要提 Diffusion 試跑 | 提，只寫一句 |\n| 3 | AGENTS.md 第 10、11 節與 pre-commit hook 是 AI 自行加入 | 全部同意，記錄為「事後經使用者確認」 |\n| 4 | 範例圖 G 的 6 條邊由 AI 看圖讀出，文字無法驗證 | <strong>使用者親自看 G2 p.2 確認 6 條都對</strong> |\n| 5 | 簡報 16 頁逐頁確認 | 15 頁保留；第 5 頁「圖標不明顯，可以是動態的」→ 改成可操作的 stack／queue |\n| 6 | 要不要放 GitHub | 放，公開 repo（排除講義 PDF 與講義全文） |\n| 7 | 公開 wiki 的更新 | 允許 AI 重新發佈 |</p>"}, {"id": "agents", "title": "AGENTS.md 員工手冊", "group": "過程紀錄", "path": "AGENTS.md", "html": "<h1>AGENTS.md — 資料結構 LLM Wiki 員工手冊</h1>\n<p>依 Karpathy 的 LLM Wiki 構想：raw/ 是來源（只讀），wiki/ 由 AI 寫與維護，人負責選來源、提問、審核。\n本手冊由「需求訪談紀錄」產生（見 00-需求訪談紀錄.md），修改時要在 wiki/log.md 記錄原因。</p>\n<h2>1. 讀者與語言</h2>\n<ul>\n<li>讀者：會一點程式、沒學過該單元的人。先講直覺與例子，再講定義與虛擬碼。</li>\n<li>繁體中文；術語保留英文，第一次出現寫「中文（English）」，例如「廣度優先搜尋（BFS）」。</li>\n</ul>\n<h2>2. 資料夾</h2>\n<ul>\n<li><code>raw/pdf/</code>：CSE 215 講義 PDF（12 份，重複檔已排除）。<strong>永不修改。</strong></li>\n<li><code>raw/text/&lt;ID&gt;.txt</code>：每頁抽出的文字，以 <code>=== &lt;ID&gt; p.&lt;頁&gt; ===</code> 分頁，供腳本核對。</li>\n<li><code>wiki/sources/&lt;ID&gt;.md</code>：每份講義一頁來源頁。</li>\n<li><code>wiki/concepts/&lt;名稱&gt;.md</code>：概念頁，整合多份講義（只有深度層有）。</li>\n<li><code>wiki/index.md</code>：所有頁面＋一句話說明；<code>wiki/log.md</code>：時間序紀錄，格式 <code>## [時間] 動作 | 對象</code>。</li>\n</ul>\n<h2>3. 來源 ID 與層級</h2>\n<table>\n<thead>\n<tr>\n<th>ID</th>\n<th>講義</th>\n<th>層級</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>G1</td>\n<td>Lecture 9 Graphs, BFS and DFS</td>\n<td>深度</td>\n</tr>\n<tr>\n<td>G2</td>\n<td>Nonrecursive DFS and BFS</td>\n<td>深度</td>\n</tr>\n<tr>\n<td>C3</td>\n<td>Ch3 Stacks and Queues</td>\n<td>深度</td>\n</tr>\n<tr>\n<td>C4</td>\n<td>Ch4 Linked Lists</td>\n<td>深度</td>\n</tr>\n<tr>\n<td>C5</td>\n<td>Ch5 Trees</td>\n<td>深度</td>\n</tr>\n<tr>\n<td>C1</td>\n<td>Ch1 Basic Concepts</td>\n<td>深度</td>\n</tr>\n<tr>\n<td>C2 / C7 / C7E / C8 / C10 / C11</td>\n<td>Arrays / Sorting / External Merge Sort / Hashing / Efficient BST / Multiway Search Trees</td>\n<td>輕量</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>深度</strong>：來源頁＋概念頁，含關鍵虛擬碼與時間複雜度。</li>\n<li><strong>輕量</strong>：只有來源頁（章節大綱、關鍵定義、複雜度），但同樣逐句標頁碼；能連到深度概念頁時要加 <code>[[連結]]</code>。之後可升級為深度。</li>\n</ul>\n<h2>4. 出處格式（最重要）</h2>\n<ul>\n<li>每個事實句結尾都要標 <code>[ID p.頁]</code>，例如 <code>&lt;a class=\"cite\" href=\"#G1\"&gt;G1 p.23&lt;/a&gt;</code>、<code>&lt;a class=\"cite\" href=\"#C3\"&gt;C3 p.12-13&lt;/a&gt;</code>、<code>&lt;a class=\"cite\" href=\"#G1\"&gt;G1 p.5&lt;/a&gt;&lt;a class=\"cite\" href=\"#G2\"&gt;G2 p.2&lt;/a&gt;</code>。</li>\n<li>標的頁必須真的講到這件事：句子裡的英文術語至少一個要出現在該頁；數字必須出現在該頁。</li>\n<li>虛擬碼放在 ``` 區塊，區塊前一行標出處。</li>\n</ul>\n<h2>5. 寫作規則</h2>\n<ol>\n<li>只寫來源有的內容。<strong>不准加</strong>來源沒有的評價（「最重要」）、因果推論、比喻、例子。</li>\n<li>教學比喻只能改寫講義裡已有的說明，並註明「改寫自 [ID p.頁]」。</li>\n<li><strong>標題也是說法</strong>：<code>#</code>、<code>##</code> 不准帶來源沒有的評價或描述。</li>\n<li>講義沒提供的細節寫「講義未提供」，不准用自己的知識補。</li>\n</ol>\n<h2>6. 矛盾處理</h2>\n<ul>\n<li>兩份講義說法、術語、虛擬碼細節不同時，用 <code>&gt; ⚠ 矛盾：</code> 區塊並列兩方與頁碼，不替讀者選邊。</li>\n</ul>\n<h2>7. Ingest 流程（一次一份）</h2>\n<p>讀 raw/text → 寫來源頁 → 更新或新增概念頁 → 更新 index、log → <code>python3 scripts/lint_wiki.py</code> 全過 → 開新對話做 AI 審查（只給 raw/text 與 wiki/）→ 不支持＝0 才 <code>git commit</code>。\n順序：G1 → G2 → C3 → C4 → C5 → C1 → 輕量 6 份。</p>\n<h2>8. Lint 檢查項目</h2>\n<ul>\n<li>每個事實句都有出處；ID 存在；頁碼不超過該講義頁數。</li>\n<li>英文術語至少一個出現在所標頁；數字出現在所標頁。</li>\n<li><code>[[連結]]</code> 目標存在。</li>\n</ul>\n<h2>9. 產出簡報時</h2>\n<ul>\n<li>只能用 wiki 內容；每頁標出來自哪個 wiki 頁與講義頁碼。</li>\n<li>BFS/DFS 動畫用講義的範例圖；動畫跑出的走訪順序必須和講義寫的一致（腳本核對）。</li>\n</ul>\n<h2>10. Wiki 自己的註記（ingest 審查後由 AI 提出，2026-11-23 21:52 經使用者事後確認）</h2>\n<ul>\n<li>不是講義內容、而是 wiki 自己的驗證或說明（例如腳本核對結果），一律用 <code>- 註（wiki）：</code> 開頭，不標講義頁碼，也不准夾帶講義事實。</li>\n<li>文字抽取會把上標弄丟（2ⁿ → 2n）。寫入 wiki 時要還原成 n²、2ⁿ，避免字面錯誤。</li>\n</ul>\n<h2>11. 簡報圖片（需求變更後由 AI 提出，2026-11-23 21:52 經使用者事後確認）</h2>\n<ul>\n<li>只能用講義頁面的截圖，<code>photo:</code> 指定的頁碼必須落在該頁證據卡引用的頁碼範圍內（C 關卡檢查）。</li>\n<li>不放真人照片。</li>\n</ul>"}, {"id": "log", "title": "wiki/log.md", "group": "過程紀錄", "path": "wiki/log.md", "html": "<h1>Log</h1>\n<h2>[2026-11-23 20:26] setup | AGENTS.md、需求訪談紀錄</h2>\n<h2>[2026-11-23 20:50] ingest | G1 Lecture 9 Graphs, BFS and DFS</h2>\n<ul>\n<li>新增 sources/G1；concepts：graph-basics、graph-representation、dfs、bfs、dfs-applications、bfs-applications</li>\n<li>⚠ 記錄：G1 p.95 O(n+m) 與 O(m) 並存；G1 遞迴 DFS vs G2 非遞迴（G2 待 ingest）</li>\n</ul>\n<h2>[2026-11-23 21:00] ingest | G2 Nonrecursive DFS and BFS</h2>\n<ul>\n<li>新增 sources/G2；concepts：dfs-nonrecursive、bfs-queue、example-graph-g</li>\n<li>範例圖 G 的邊從 G2 p.2 圖片讀出；scripts/check_traversal.py 核對 DFS 順序、stack 變化、BFS 順序 ✅</li>\n</ul>\n<h2>[2026-11-23 21:05] ingest | C3、C4、C5、C1</h2>\n<ul>\n<li>新增 sources/C3、C4、C5、C1；concepts：stack-and-queue、tree-traversal、big-o</li>\n<li>⚠ 記錄：C5 p.21 註解（leftChild）與程式碼（rightChild）不一致</li>\n<li>lint 抓到 4 句：2 句來源頁的「與 graph 相關」該頁沒提 graph、1 句引用圖片內容、1 句「8 個方向」是 AI 自己數的 → 改寫</li>\n</ul>\n<h2>[2026-11-23 21:20] ingest（輕量）| C2、C7、C7E、C8、C10、C11</h2>\n<ul>\n<li>每份一頁來源頁：章節大綱（依各頁標題）＋關鍵定義／複雜度，逐句標頁碼</li>\n</ul>\n<h2>[2026-11-23 21:45] 需求變更 | 簡報讀者改為完全不會的人、加入講義圖片</h2>\n<ul>\n<li>dfs、bfs 各補一句，引用迷宮與鳥瞰的連續投影片頁碼範圍（簡報要用那些頁的圖）</li>\n<li>lint 抓到「16 張投影片」是自己數的數字（又一次同類型錯誤）→ 刪掉數字</li>\n</ul>\n<h2>[2026-11-23 21:50] workflow | 發現 lint 失敗時 commit 仍會成功（結果經過 pipe 被忽略）→ 加 git pre-commit hook，lint 沒過就拒絕 commit</h2>\n<h2>[2026-11-23 21:52] 事後確認訪談 | 使用者指出 AI 很多細節沒問就執行</h2>\n<ul>\n<li>使用者看圖確認範例圖 G 的 6 條邊；事後確認 AGENTS.md 第 10、11 節與 pre-commit hook</li>\n<li>簡報逐頁確認：第 5 頁改成可操作的 stack／queue</li>\n</ul>\n<h2>[2026-11-23 22:10] 簡報 v3 | 第 5 頁動態化</h2>\n<ul>\n<li>截圖發現自 v1 起「Queue：…」一行被渲染程式當成測驗題（Q 開頭）→ 改為只認 Q＋數字；建置時新增「逐頁稿行數＝渲染出的重點數」檢查，並用舊規則驗證能抓到</li>\n</ul>"}, {"id": "workflow", "title": "Loop / Graph 設計", "group": "過程紀錄", "path": "WORKFLOW.md", "html": "<h1>Loop / Graph 設計</h1>\n<p>整體是一個 <strong>Graph</strong>（關卡事先畫好、錯在哪關退回哪關），每個 AI 節點裡面是一個 <strong>小 Loop</strong>（生成 → 檢查 → 修，最多 3 輪）。所有中間產物都是檔案，可以單獨打開、放進 git、單獨重跑。</p>\n<h2>階段一：建 Wiki（每份講義跑一次這條線）</h2>\n<pre><code>[訪談] → [需求摘要] → (人確認) → [AGENTS.md]\n                                   │\n   ┌───────────────────────────────┘\n   ▼\n[抽文字 raw/text，逐頁]                 ← 程式\n   ▼\n[寫來源頁＋概念頁] ◄──────────────┐     ← AI 節點\n   ▼                              │ 小圈：只改被點名的句子\n&lt;lint_wiki.py&gt; ── ❌ ─────────────┤     ← 程式關卡：出處／頁碼／術語／數字／連結\n   ▼ ✅                           │\n&lt;AI 審查（新對話）&gt; ── 部分支持 ──┘     ← AI 關卡：忠實度\n   │ 不支持&gt;0 或資料缺口 ──► 大圈：回到「抽文字／補來源」\n   ▼ ✅\n[git commit] → 下一份講義\n</code></pre>\n<h2>階段二：Wiki → 教學 HTML 簡報</h2>\n<pre><code>[1 檢索 wiki] → &lt;A 覆蓋率：必學子題都有頁？&gt; ─❌→ 停下，回階段一補 ingest\n       ▼ ✅\n[2 證據卡：程式從 wiki 抽句，不經 AI]\n       ▼\n[3 大綱：每頁分配哪些卡] → &lt;B 大綱關卡：頁數、子題覆蓋&gt; → (人確認)\n       ▼\n[4 逐頁稿] ◄─────────────────────────────┐\n       ▼                                 │ 小圈\n&lt;C 出處關卡：每行都標卡？出處在卡裡？     │\n  數字在卡裡？≤70 字、≤7 行？&gt; ── ❌ ────┤\n       ▼ ✅                              │\n&lt;D AI 忠實度審查（新對話，只給稿＋卡）&gt; ─┘\n       │ 卡上沒有的內容 → 退回「大綱」補卡，或回階段一修 wiki\n       ▼ ✅\n[5 渲染 HTML：程式機械轉換，不改任何字；\n   動畫步驟由程式依講義演算法產生，先和講義順序比對]\n       ▼\n&lt;E 渲染關卡：每頁截圖、內容壓到 footer？JS 錯誤？\n  動畫最後畫面＝講義順序？&gt; ── ❌ → 退回渲染（版面）或逐頁稿（字太多）\n       ▼ ✅\n[交件：deck.html ＋ checks/ 檢查紀錄]\n</code></pre>\n<h2>哪些步驟會重複？</h2>\n<ul>\n<li><strong>每份講義</strong>都跑一次階段一（共 12 次：深度 6、輕量 6）。</li>\n<li><strong>逐頁稿 ↔ C 關卡</strong>、<strong>渲染 ↔ E 關卡</strong>是小圈，錯了就在附近修，最多 3 輪。</li>\n<li>停止條件：關卡全過；或改滿 3 輪仍不過就停下來請人看；覆蓋率不足就停，不硬湊。</li>\n</ul>\n<h2>哪裡需要檢查或重新生成？</h2>\n<table>\n<thead>\n<tr>\n<th>節點</th>\n<th>誰檢查</th>\n<th>不過時</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>wiki 頁</td>\n<td>lint（程式）＋AI 審查（新對話）</td>\n<td>只改被點名的句子</td>\n</tr>\n<tr>\n<td>證據卡</td>\n<td>不需要：由程式抽，AI 無法加料</td>\n<td>—</td>\n</tr>\n<tr>\n<td>逐頁稿</td>\n<td>C 關卡（程式）＋D 審查（AI）</td>\n<td>小圈改稿；缺資料走大圈</td>\n</tr>\n<tr>\n<td>HTML</td>\n<td>E 關卡（程式截圖＋量測）</td>\n<td>改版面或縮短稿</td>\n</tr>\n<tr>\n<td>動畫順序</td>\n<td>check_traversal.py（wiki 階段）＋E 關卡（渲染後）</td>\n<td>停止渲染</td>\n</tr>\n</tbody>\n</table>\n<h2>為什麼這樣設計？</h2>\n<ol>\n<li><strong>「檢查一下」不算驗證</strong>：能寫成程式的檢查都寫成腳本（頁碼存在、術語在該頁、數字在該頁、字數、版面、動畫順序）。</li>\n<li><strong>程式抓不到的才交給 AI 審查</strong>，而且開新對話、只給成品和來源，不讓它審自己的作品。</li>\n<li><strong>把 AI 能出錯的節點變少</strong>：證據卡、HTML、動畫步驟都改由程式產生，錯誤只可能出在「寫 wiki」和「寫逐頁稿」兩個 AI 節點，檢查就集中在這兩處。</li>\n<li><strong>錯在哪關退回哪關</strong>：第 6 頁錯，其他 14 頁不動。</li>\n</ol>"}, {"id": "reflection", "title": "執行紀錄與反思", "group": "過程紀錄", "path": "REFLECTION.md", "html": "<h1>執行紀錄與反思</h1>\n<h2>一次實際執行的結果（2026-11-23，詳細紀錄在 checks/）</h2>\n<table>\n<thead>\n<tr>\n<th>階段</th>\n<th>關卡</th>\n<th>第 1 次結果</th>\n<th>最後結果</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Wiki：G1</td>\n<td>lint</td>\n<td>❌ 14 個（其中 3 個是 lint 自己的設計問題）</td>\n<td>✅ 第 2 輪</td>\n</tr>\n<tr>\n<td>Wiki：G1</td>\n<td>AI 審查</td>\n<td>不支持 0、部分支持 7</td>\n<td>全部修正</td>\n</tr>\n<tr>\n<td>Wiki：G2、C3、C4、C5、C1</td>\n<td>check_traversal.py</td>\n<td>✅ DFS 順序、stack 每一步、BFS 順序都和 G2 一致</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Wiki：同上</td>\n<td>lint</td>\n<td>❌ 4 句</td>\n<td>✅ 第 2 輪</td>\n</tr>\n<tr>\n<td>Wiki：同上</td>\n<td>AI 審查</td>\n<td>不支持 0、部分支持／無法從文字驗證 6</td>\n<td>全部修正</td>\n</tr>\n<tr>\n<td>Wiki：輕量 6 份</td>\n<td>lint＋AI 審查</td>\n<td>✅ 0 個問題</td>\n<td>—</td>\n</tr>\n<tr>\n<td>簡報</td>\n<td>A 覆蓋率、B 大綱</td>\n<td>✅</td>\n<td>—</td>\n</tr>\n<tr>\n<td>簡報</td>\n<td>C 出處關卡</td>\n<td>❌ 3 個（封面數字 215 無來源；第 11 頁引用的頁不在分配的卡）</td>\n<td>✅ 第 4 輪</td>\n</tr>\n<tr>\n<td>簡報</td>\n<td>D AI 忠實度審查</td>\n<td>不支持 0、部分支持 6、教學缺口 3</td>\n<td>全部修正</td>\n</tr>\n<tr>\n<td>簡報</td>\n<td>E 渲染關卡</td>\n<td>❌ 第 15 頁對應表超出頁面</td>\n<td>✅ 第 3 輪</td>\n</tr>\n<tr>\n<td>需求變更：簡報 v2（給完全不會的人＋講義圖片）</td>\n<td>wiki lint</td>\n<td>❌「16 張投影片」又是自己數的數字；且 lint 失敗時 commit 仍成功</td>\n<td>✅ 加 pre-commit hook</td>\n</tr>\n<tr>\n<td>簡報 v2</td>\n<td>D AI 忠實度審查</td>\n<td>❌ 17 行（不支持 2、部分支持 15）：口語化時加了比喻和事實</td>\n<td>修正後重審</td>\n</tr>\n<tr>\n<td>簡報 v2</td>\n<td>E 渲染關卡</td>\n<td>✅ 但截圖發現封面疊在每一頁，關卡沒抓到</td>\n<td>新增「同時只能顯示一張」檢查，並故意放回 bug 驗證它抓得到</td>\n</tr>\n</tbody>\n</table>\n<p>每次 ingest 都有 git commit；12 份講義、26 頁 wiki、15 頁簡報。</p>\n<h2>反思</h2>\n<h3>哪一個節點最常出錯？</h3>\n<p><strong>「寫 wiki 頁」這個 AI 節點。</strong> 它幾乎不會講錯，但很愛「順手補一點」，而且照樣貼上出處標籤：\n- 自己數出來的數字：迷宮「8 個方向」，講義只列方向名稱；\n- 只在圖片裡的資訊被寫成文字事實：「只沿著邊的方向走」「每次從還沒走到的地方開始」；\n- 自己加的連結或推論：「adjacency list 以 linked list 實作」，標的那頁根本沒提；\n- PDF 抽取本身的錯：上標遺失，2ⁿ 變成 2n，字面上變成錯的。</p>\n<p>程式 lint 只能檢查「有沒有標、頁碼在不在、字有沒有出現」，<strong>標了但那頁其實沒這樣說</strong>只有 AI 審查抓得到。</p>\n<h3>發現問題後，把檢查往前移到哪一步？</h3>\n<ol>\n<li><strong>AI 審查從「簡報做完才審」移到「每份講義 ingest 完就審」</strong>（AGENTS.md 第 7 節）。錯誤在 wiki 就擋下，不會流進簡報。</li>\n<li><strong>動畫順序在 wiki 階段就由 check_traversal.py 核對</strong>，不等到做完簡報才發現圖讀錯。</li>\n<li><strong>證據卡改由程式從 wiki 抽句</strong>，AI 沒有機會在這一關加料；C 關卡也直接擋下「引用了沒分配給這頁的卡」。</li>\n</ol>\n<h3>有沒有因此修改 workflow / graph？為什麼？</h3>\n<p>有，改了四處：\n- <strong>AGENTS.md 新增第 10 節</strong>：wiki 自己的驗證一律用「註（wiki）」開頭、不准標講義頁碼；抽取文字要還原上標。原因是 AI 會把自己腳本的驗證結果標成講義頁碼，看起來像講義寫的。\n- <strong>lint 加縮寫對照（DFS ↔ Depth First Search）與「待建頁面」清單</strong>：第一次 lint 的 14 個問題中有 3 個是 lint 自己誤判。不修的話，會習慣性忽略 lint 的警告，那 lint 就沒有用了。\n- <strong>簡報 graph 補了 AI 審查提出的教學缺口</strong>（DAG 前提、Li 和 queue 是同一個 BFS），而且補的內容只能從卡裡拿。\n- <strong>渲染關卡改成量測「內容有沒有壓到 footer」</strong>，不靠人眼看。\n- <strong>加 git pre-commit hook</strong>：lint 沒過就拒絕 commit，不再依賴人記得看結果。\n- <strong>渲染關卡新增「同時只能顯示一張投影片」</strong>，並 AGENTS.md 第 11 節規定圖片只能用證據卡頁碼範圍內的講義頁、不放真人照片（C 關卡檢查）。</p>\n<p>結論：先把「完成的定義」寫成腳本，程式管格式、AI 管意思；錯誤要在離源頭最近的地方被抓到。這次最常轉的是小圈，大圈只在資料缺口時用到。</p>\n<h2>事後確認（使用者指出 AI 很多細節沒問就執行）</h2>\n<ul>\n<li>分工：主題、範圍、讀者、語言、出處粒度、要動畫、要有趣、逐頁內容由使用者決定；AI 負責提問、撰寫、寫腳本、產生簡報與審查。</li>\n<li>使用者親自看圖確認範例圖 G 的 6 條邊（文字無法驗證的唯一節點）。</li>\n<li>使用者逐頁確認簡報；第 5 頁改成動態後，看截圖發現「Queue：…」一行從第一版就被當成測驗題渲染，三輪關卡都沒抓到 → 新增「逐頁稿與渲染內容一致」檢查。</li>\n<li>結論：AI 自行做的決定要列出來讓人逐項確認；人管程式和 AI 都看不到的部分。</li>\n<li>換成資料結構之前，曾先用另一個主題試跑一次，學到「標題也算說法」，寫進了 AGENTS.md。</li>\n</ul>"}, {"id": "check-1", "title": "01-lint-G1-round1.txt", "group": "過程紀錄", "path": "checks/01-lint-G1-round1.txt", "html": "<pre><co e></pre>"}, {"id": "check-25", "title": "12-v2-summary.md", "group": "過程紀錄", "path": "checks/12-v2-summary.md", "html": "<h1>檢查紀錄 12：需求變更後第二次執行（簡報 v2）</h1>\n<p>需求變更：讀者改為「完全不會的人」，加入講義圖片（見 00-需求訪談紀錄.md）</p>\n<table>\n<thead>\n<tr>\n<th>節點 / 關卡</th>\n<th>結果</th>\n<th>處置</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>wiki 補兩句（迷宮、鳥瞰的頁碼範圍）</td>\n<td>lint ❌「16 張投影片」自己數的數字；bfs 句 nodes 不在頁</td>\n<td>修正</td>\n</tr>\n<tr>\n<td>（發現）lint 失敗但 commit 成功</td>\n<td>結果經 pipe 被忽略</td>\n<td>加 pre-commit hook，用一行假出處測試，確認會拒絕</td>\n</tr>\n<tr>\n<td>C 出處關卡（含新的圖片頁碼檢查）</td>\n<td>❌「1、2、3 步」數字不在卡（講義寫 one/two/three steps）</td>\n<td>小圈改字 → ✅</td>\n</tr>\n<tr>\n<td>D 忠實度審查（AI 新對話）</td>\n<td>❌ 不支持 2、部分支持 15（口語化加了比喻、事實，限定詞消失）</td>\n<td>全部修正 → C ✅ → 第 2 次審查</td>\n</tr>\n<tr>\n<td>E 渲染關卡</td>\n<td>✅ 但人工看截圖發現封面疊在每一頁</td>\n<td>CSS 衝突；關卡新增「同時只能顯示一張」，故意放回 bug 確認抓得到 → ✅</td>\n</tr>\n<tr>\n<td>D 第 2 次審查</td>\n<td>不支持 0、講反 0、部分支持 5（限定詞消失、「小錯誤」是自己的判斷等）</td>\n<td>全部修正 → C ✅ → 停止（已無不支持／講反）</td>\n</tr>\n</tbody>\n</table>"}, {"id": "check-26", "title": "13-grill-and-v3.md", "group": "過程紀錄", "path": "checks/13-grill-and-v3.md", "html": "<h1>檢查紀錄 13：事後確認訪談與簡報 v3</h1>\n<h2>人工確認（使用者親自把關的節點）</h2>\n<ul>\n<li>範例圖 G 的 6 條邊：AI 審查員判「文字無法驗證」→ 使用者看 G2 p.2 原圖確認 ✅</li>\n<li>簡報 16 頁逐頁確認：15 頁保留，第 5 頁要求改成動態</li>\n</ul>\n<h2>簡報 v3</h2>\n<table>\n<thead>\n<tr>\n<th>關卡</th>\n<th>結果</th>\n<th>處置</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>E 渲染關卡（新增 stack／queue 行為檢查）</td>\n<td>✅ pop 後剩 AB（LIFO）、dequeue 後剩 BC（FIFO）</td>\n<td>—</td>\n</tr>\n<tr>\n<td>人工看截圖</td>\n<td>❌ 第 5 頁「Queue：…」被當成測驗題（自 v1 就存在，三輪關卡都沒抓到）</td>\n<td>修渲染規則；新增「逐頁稿行數＝渲染重點數」檢查，用舊規則測試能抓到</td>\n</tr>\n</tbody>\n</table>\n<h2>觀察</h2>\n<ul>\n<li>這次唯一一個「從第一版就在、所有關卡都漏掉」的錯，是靠人看截圖發現的；關卡只檢查「有沒有溢出」，沒檢查「渲染後的內容跟稿一不一樣」。</li>\n<li>人工確認不可取代：圖片內容（邊）只能由人看圖確認。</li>\n</ul>"}, {"id": "check-27", "title": "13-v3-render.txt", "group": "過程紀錄", "path": "checks/13-v3-render.txt", "html": "<pre><code>✅ 第 5 頁 stack pop 後剩 AB（應為 AB，LIFO）、queue dequeue 後剩 BC（應為 BC，FIFO）\n✅ 第 7 頁 DFS 動畫最後畫面：v3v2v1v4v5（講義 v3 const COL={"首頁":"var(--ink)","概念頁":"var(--red)","來源頁":"var(--blue)","原始講義文字":"var(--green)","過程紀錄":"var(--amber)"};
const byId=Object.fromEntries(PAGES.map(p=>[p.id,p]));
const nav=document.getElementById('nav'),art=document.getElementById('art'),q=document.getElementById('q');
function drawNav(f=''){const groups={};for(const p of PAGES){if(f&&!(p.title+p.id).toLowerCase().includes(f))continue;(groups[p.group]??=[]).push(p)}
 nav.innerHTML=Object.entries(groups).map(([g,ps])=>`<h2 style="--c:${COL[g]}">${g}</h2>`+ps.map(p=>`<a href="#${p.id}" data-id="${p.id}" style="--c:${COL[g]}">${p.title}</a>`).join('')).join('')||'<p class="empty">沒有符合的頁面</p>';mark()}
function mark(){const id=location.hash.slice(1)||'index';for(const a of nav.querySelectorAll('a'))a.classList.toggle('on',a.dataset.id===id)}
function show(){const id=location.hash.slice(1)||'index';const p=byId[id]||byId.index;art.innerHTML=`<p class="path">${p.path}</p>`+p.html;mark();window.scrollTo(0,0)}
q.addEventListener('input',()=>drawNav(q.value.trim().toLowerCase()));
addEventListener('hashchange',show);drawNav();show();
}
